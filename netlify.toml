[build]
  publish = "."

# Les images de la visite ne changent pas : on les garde en cache longtemps.
[[headers]]
  for = "/seq/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
